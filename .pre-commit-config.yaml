# Pre-commit configuration - Trading System (Final v2)
# T2.06 (chat 7) - bugs fixed
#
# Setup:
#   pip install pre-commit==3.7.1 black==24.4.2 isort==5.13.2
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Emergency bypass:
#   git commit --no-verify -m "[skip-hooks: REASON] ..."

default_language_version:
  python: python3.11

# فقط روی فایل‌های staged اجرا کن (نه کل پروژه)
default_stages: [pre-commit]

repos:
  # ========== Built-in hooks (selective) ==========
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/.*\.md$
      - id: end-of-file-fixer
        exclude: ^(.*\.svg|.*\.cmd|.*\.bat)$
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/package-lock\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # ========== Python: black (auto-fix) ==========
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        files: ^(backend/app/|backend/tests/|scripts/).*\.py$
        args: ['--line-length=100']

  # ========== Python: isort (auto-fix) ==========
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^(backend/app/|backend/tests/|scripts/).*\.py$
        args: ['--profile=black', '--line-length=100']

  # ========== Local custom hooks ==========
  - repo: local
    hooks:
      - id: check-anti-patterns
        name: Anti-Patterns A1-A10 check
        entry: python scripts/check_anti_patterns.py
        language: system
        types: [python]
        pass_filenames: false

      - id: layer1-audit
        name: Layer 1 — Documentation Consistency Audit (v2.15)
        entry: python scripts/63_pre_commit_audit.py
        language: system
        pass_filenames: false
        always_run: true
        # پوشش M71-M79: drift detection در modular constitution + SESSION_STATUS + DECISIONS_LOG + PENDING
        # به پیوست Bug #54 (Decisions Numbering Gap) + قانون #۶۶
        # Bypass در اضطرار (قانون #۴۲):
        #   git commit --no-verify -m "[skip-hooks: REASON] ..."
